[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
rig-agent = "=0.42.0"
rig-core = "=0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.24.0", default-features = false, features = ["std", "macros"] }
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
thiserror = "=2.0.21"
tokio-rusqlite = { version = "=0.8.0", features = ["bundled"] }

[dev-dependencies]
rig-agent = { version = "=0.42.0", features = ["test-utils"] }
wiremock = "0.6.5"
