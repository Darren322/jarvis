[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
futures-util = "=0.3.34"
hound = "3.5.1"
reqwest = { version = "0.13.5", features = ["json"] }
rig-agent = "=0.42.0"
rig-core = "=0.42.0"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.24.0", default-features = false, features = ["std", "macros"] }
sha2 = "=0.10.9"
sqlite-vec = "=0.1.6"
sysinfo = "0.39.6"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rusqlite = { version = "=0.8.0", features = ["bundled"] }

[dev-dependencies]
rig-agent = { version = "=0.42.0", features = ["test-utils"] }
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.5"

[[test]]
name = "binary_integration"
path = "tests/integration/cli/workflow_tests.rs"
