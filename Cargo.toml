[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
arrow-array = "=58.0.0"
fastembed = { version = "=4.9.1", default-features = false, features = ["ort-load-dynamic"] }
futures-util = "=0.3.34"
reqwest = { version = "0.13.5", features = ["json"] }
lancedb = { version = "=0.30.0", default-features = false }
lance-index = "=7.0.0"
libloading = "=0.8.9"
rig-agent = "=0.42.0"
rig-core = "=0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = "=1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.24.0", default-features = false, features = ["std", "macros"] }
sha2 = "=0.10.9"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full", "test-util"] }
thiserror = "=2.0.21"
tokenizers = "=0.21.4"
tokio-rusqlite = { version = "=0.8.0", features = ["bundled"] }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
tempfile = "=3.27.0"
hound = "3.5.1"

[dev-dependencies]
rig-agent = { version = "=0.42.0", features = ["test-utils"] }
wiremock = "0.6.5"

[[test]]
name = "binary_integration"
path = "tests/integration/cli/workflow_tests.rs"
