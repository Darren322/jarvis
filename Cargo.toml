[package]
name = "jarvis"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
dotenvy = "0.15.7"
earshot = "=1.2.2"
futures-util = "=0.3.34"
hound = "3.5.1"
jiff = "=0.2.37"
orb-protocol = { path = "crates/orb-protocol" }
reqwest = { version = "0.13.5", features = ["json"] }
rig-agent = "=0.42.0"
rig-core = "=0.42.0"
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "wav"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = { version = "3.24.0", default-features = false, features = ["std", "macros"] }
sha2 = "=0.10.9"
sqlite-vec = "=0.1.6"
sysinfo = "0.39.6"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-rusqlite = { version = "=0.8.0", features = ["bundled"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["codec"] }

[dev-dependencies]
rig-agent = { version = "=0.42.0", features = ["test-utils"] }
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-tungstenite = "=0.29.0"
wiremock = "0.6.5"

[[test]]
name = "binary_integration"
path = "tests/integration/cli/workflow_tests.rs"

[[test]]
name = "orb_websocket_integration"
path = "tests/integration/orb/websocket_tests.rs"

[workspace]
members = ["crates/*"]
